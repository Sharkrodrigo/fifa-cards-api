<!-- src/player/templates/card.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card</title>
  <style>
    body {
      font-family: Arial;
      width: 300px;
      border: 2px solid #000;
      padding: 10px;
      background: #f3f3f3;
    }
    h2 { margin: 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }
  </style>
</head>
<body>
  <h2>{{nome}} ({{overall}})</h2>
  <img src="{{fotourl}}" width="100%" />
  <p>Posição: {{posicao}}</p>
  <div class="stats">
    <span>PAC: {{stats.pac}}</span>
    <span>SHO: {{stats.sho}}</span>
    <span>PAS: {{stats.pas}}</span>
    <span>DRI: {{stats.dri}}</span>
    <span>DEF: {{stats.def}}</span>
    <span>PHY: {{stats.phy}}</span>
  </div>
</body>
</html>
